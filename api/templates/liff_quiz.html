<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>中醫國考題庫練習</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b241d;
    --ink-soft: #7a6d5c;
    --paper: #f6efe2;
    --surface: #fffcf6;
    --line: #e5d9c3;
    --terracotta: #b8562f;
    --terracotta-soft: #f1ddc9;
    --sage: #5f7052;
    --sage-soft: #e3e8d9;
    --gold: #a9843f;
    --danger: #a8451f;
    --danger-soft: #f3ded1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding-bottom: 92px;
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3, .display { font-family: "Noto Serif TC", "Noto Sans TC", serif; }
  header.topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header.topbar h1 { font-size: 17px; margin: 0; font-weight: 800; letter-spacing: .02em; }
  .tabbar { display: flex; gap: 6px; background: var(--paper); padding: 3px; border-radius: 999px; }
  .tabbar button {
    border: none; background: transparent; color: var(--ink-soft);
    padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  .tabbar button.active { background: var(--terracotta); color: #fff9f2; }
  main { padding: 16px; max-width: 640px; margin: 0 auto; }
  .view { display: none; }
  .view.active { display: block; }

  .selectors { display: flex; gap: 8px; margin-bottom: 16px; }
  select {
    flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--surface); font-size: 14px; color: var(--ink);
    font-family: inherit;
  }

  .q-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(43,36,29,.04);
  }
  .q-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .q-title { font-size: 15px; font-weight: 500; line-height: 1.6; flex: 1; }
  .bookmark-btn {
    border: none; background: none; cursor: pointer; line-height: 1;
    color: var(--ink-soft); padding: 4px; flex-shrink: 0;
    transition: color .15s ease, transform .1s ease;
  }
  .bookmark-btn svg { width: 19px; height: 19px; display: block; }
  .bookmark-btn:active { transform: scale(.9); }
  .bookmark-btn.active { color: var(--terracotta); }
  .bookmark-btn.active svg { fill: var(--terracotta); }

  .options { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .opt-label {
    display: flex; align-items: center; gap: 9px; padding: 9px 11px;
    border: 1px solid var(--line); border-radius: 10px; font-size: 14px; cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .opt-label:active { background: var(--paper); }
  .opt-label input { accent-color: var(--terracotta); }
  .opt-label.correct { border-color: var(--sage); background: var(--sage-soft); }
  .opt-label.wrong-pick { border-color: var(--danger); background: var(--danger-soft); }

  .q-tools {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line);
  }
  .toggle-wrap { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-soft); }
  .switch { position: relative; width: 36px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0; background: #d9cbb0; border-radius: 999px; transition: background .15s ease;
  }
  .slider::before {
    content: ""; position: absolute; height: 16px; width: 16px; left: 2px; top: 2px;
    background: #fff; border-radius: 50%; transition: transform .15s ease;
  }
  input:checked + .slider { background: var(--terracotta); }
  input:checked + .slider::before { transform: translateX(16px); }

  .link-btn {
    border: none; background: none; color: var(--terracotta); font-size: 13px; cursor: pointer; font-weight: 700;
    display: inline-flex; align-items: center; gap: 4px; padding: 2px;
  }
  .link-btn:active { opacity: .6; }

  .reveal-answer {
    margin-top: 10px; font-size: 13px; color: var(--sage); font-weight: 700; display: none;
    background: var(--sage-soft); padding: 8px 10px; border-radius: 8px;
  }
  .reveal-answer.show { display: block; }

  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface);
    border-top: 1px solid var(--line); padding: 10px 14px;
    display: flex; gap: 10px; justify-content: space-between;
  }
  .btn {
    border: none; border-radius: 10px; padding: 13px 18px; font-size: 15px; font-weight: 700; cursor: pointer;
    transition: transform .1s ease, opacity .15s ease;
    font-family: inherit;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--terracotta); color: #fff9f2; flex: 1; }
  .btn-ghost { background: var(--paper); color: var(--ink-soft); }

  .empty-hint { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 34px 10px; }

  /* 結果頁 */
  .result-overlay {
    display: none; position: fixed; inset: 0; background: var(--paper); z-index: 50; overflow-y: auto;
  }
  .result-overlay.active { display: block; }
  .result-header {
    position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    font-family: "Noto Serif TC", serif; font-weight: 700;
  }
  .close-x { border: none; background: none; font-size: 20px; cursor: pointer; color: var(--ink-soft); line-height: 1; padding: 4px; }
  .grade-box {
    margin: 24px auto 8px; width: 136px; height: 136px; border-radius: 50%;
    background: var(--terracotta-soft); border: 3px solid var(--terracotta);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .grade-box .num { font-family: "Noto Serif TC", serif; font-size: 36px; font-weight: 800; color: var(--terracotta); font-variant-numeric: tabular-nums; }
  .grade-box .label { font-size: 11px; color: var(--ink-soft); letter-spacing: .08em; text-transform: uppercase; }
  .section-title {
    font-size: 13px; font-weight: 700; margin: 20px 0 8px; padding: 7px 11px; border-radius: 8px;
    letter-spacing: .02em;
  }
  .section-title.wrong { background: var(--danger-soft); color: var(--danger); }
  .section-title.correct { background: var(--sage-soft); color: var(--sage); }
  .result-item {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px; margin-bottom: 8px;
  }
  .result-item .rq-title { font-size: 14px; font-weight: 500; margin-bottom: 5px; line-height: 1.5; }
  .result-item .rq-meta { font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }

  /* AI 詳解面板（從下往上蓋一層） */
  .ai-panel {
    display: none; position: fixed; inset: 0; background: rgba(43,36,29,.45); z-index: 60;
  }
  .ai-panel.active { display: flex; align-items: flex-end; }
  .ai-panel-inner {
    background: var(--surface); width: 100%; max-height: 80vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding: 18px; position: relative;
  }
  .ai-panel-inner h3 { margin: 0 0 10px; font-size: 16px; padding-right: 30px; }
  .ai-panel .close-x { position: absolute; top: 14px; right: 14px; }
  .ai-content { font-size: 14px; line-height: 1.75; white-space: pre-wrap; color: var(--ink); }
  .ai-followup { display: flex; gap: 6px; margin-top: 14px; }
  .ai-followup input {
    flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); font-size: 14px;
    font-family: inherit;
  }
  .ai-loading { color: var(--ink-soft); font-size: 13px; }

  /* 錯題本 */
  .wrong-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 13px; margin-bottom: 8px;
  }
  .wrong-item .wq-text { font-size: 14px; flex: 1; line-height: 1.5; }
  .wrong-item .wq-cat { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .remove-btn {
    border: none; background: var(--sage-soft); color: var(--sage); cursor: pointer;
    width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s ease;
  }
  .remove-btn:active { transform: scale(.9); }
  .remove-btn svg { width: 15px; height: 15px; }
</style>
</head>
<body>

<header class="topbar">
  <h1>中醫國考題庫練習</h1>
  <div class="tabbar">
    <button id="tab-quiz" class="active" onclick="switchTab('quiz')">考題</button>
    <button id="tab-wrong" onclick="switchTab('wrong')">錯題本</button>
  </div>
</header>

<main>
  <!-- ① 考題頁 -->
  <section id="view-quiz" class="view active">
    <div class="selectors">
      <select id="select-category"></select>
      <select id="select-scope">
        <option value="chapter">依章節</option>
        <option value="year">依年度（尚未支援）</option>
      </select>
    </div>
    <div id="question-list"></div>
    <div id="quiz-empty" class="empty-hint" style="display:none;">這個分類目前還沒有題目</div>
  </section>

  <!-- ③ 錯題本 -->
  <section id="view-wrong" class="view">
    <div class="selectors">
      <select id="wrong-category-filter">
        <option value="">全部錯題</option>
      </select>
    </div>
    <div id="wrong-list"></div>
    <div id="wrong-empty" class="empty-hint" style="display:none;">目前沒有標記的錯題</div>
  </section>
</main>

<div class="bottom-bar" id="quiz-bottom-bar">
  <button class="btn btn-ghost" onclick="closeLiff()">✕ 離開</button>
  <button class="btn btn-primary" onclick="submitExam()">交卷</button>
</div>

<!-- ② 詳解與評分頁 -->
<div class="result-overlay" id="result-overlay">
  <div class="result-header">
    <strong>作答結果</strong>
    <button class="close-x" onclick="closeResult()">✕</button>
  </div>
  <main>
    <div class="grade-box">
      <div class="num" id="grade-num">--</div>
      <div class="label">Grade / 100</div>
    </div>

    <div class="section-title wrong">錯題 &amp; Concepts</div>
    <div id="wrong-results"></div>

    <div class="section-title correct">Correct</div>
    <div id="correct-results"></div>
  </main>
</div>

<!-- AI 詳解面板 -->
<div class="ai-panel" id="ai-panel">
  <div class="ai-panel-inner">
    <button class="close-x" onclick="closeAiPanel()">✕</button>
    <h3 id="ai-panel-title">詳解</h3>
    <div class="ai-content" id="ai-content"><span class="ai-loading">產生中...</span></div>
    <div class="ai-followup">
      <input id="ai-followup-input" type="text" placeholder="還有問題？直接問 AI" />
      <button class="link-btn" onclick="sendFollowUp()">問</button>
    </div>
  </div>
</div>

<script>
const LIFF_ID = "2011558628-8li3MSJw";
// 本機 ngrok 預覽用：網址加 ?debug=1 就跳過真的 LINE 登入。這個 token 要跟後端
// LIFF_DEBUG_TOKEN 環境變數一致，且只能在本機測試時使用，正式站不會設這個變數，
// 所以就算這串字外流也連不進真正上線的 API。
const DEBUG_MODE = new URLSearchParams(location.search).get("debug") === "1";
const DEBUG_TOKEN = "a2i4s9Op3RsVegplYqnjr28RD4m2Ymrb";

const ICON_BOOKMARK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg>';

let idToken = null;
let currentCategory = "";
let currentQuestions = [];   // 目前這份考卷的題目（不含答案）
let revealedAnswers = {};    // question_id -> 完整題目detail（含答案），按需快取
let currentAiQuestionId = null;

function authHeaders() {
  return idToken ? { "Authorization": "Bearer " + idToken, "Content-Type": "application/json" } : { "Content-Type": "application/json" };
}

async function apiGet(path) {
  const res = await fetch(path, { headers: authHeaders() });
  return res.json();
}
async function apiPost(path, body) {
  const res = await fetch(path, { method: "POST", headers: authHeaders(), body: JSON.stringify(body || {}) });
  return res.json();
}
async function apiDelete(path) {
  const res = await fetch(path, { method: "DELETE", headers: authHeaders() });
  return res.json();
}

function switchTab(tab) {
  document.getElementById("view-quiz").classList.toggle("active", tab === "quiz");
  document.getElementById("view-wrong").classList.toggle("active", tab === "wrong");
  document.getElementById("tab-quiz").classList.toggle("active", tab === "quiz");
  document.getElementById("tab-wrong").classList.toggle("active", tab === "wrong");
  document.getElementById("quiz-bottom-bar").style.display = tab === "quiz" ? "flex" : "none";
  if (tab === "wrong") loadWrongQuestions();
}

function closeLiff() {
  try { liff.closeWindow(); } catch (e) { window.close(); }
}

async function initApp() {
  if (DEBUG_MODE) {
    idToken = DEBUG_TOKEN;
    await loadCategories();
    return;
  }
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) {
      liff.login();
      return;
    }
    idToken = liff.getIDToken();
  } catch (e) {
    document.getElementById("question-list").innerHTML =
      '<div class="empty-hint">LIFF 初始化失敗，請確認是從 LINE 內開啟這個頁面。</div>';
    return;
  }
  await loadCategories();
}

async function loadCategories() {
  const data = await apiGet("/api/liff/quiz/categories");
  const categories = data.categories || [];
  const sel = document.getElementById("select-category");
  sel.innerHTML = categories.map(c => `<option value="${c}">${c}</option>`).join("");
  const wrongSel = document.getElementById("wrong-category-filter");
  wrongSel.innerHTML = '<option value="">全部錯題</option>' +
    categories.map(c => `<option value="${c}">${c}</option>`).join("");

  const lastCategory = localStorage.getItem("examLastCategory");
  const lastScope = localStorage.getItem("examLastScope");
  if (lastCategory && categories.includes(lastCategory)) sel.value = lastCategory;
  if (lastScope) document.getElementById("select-scope").value = lastScope;

  sel.addEventListener("change", onFilterChange);
  document.getElementById("select-scope").addEventListener("change", onFilterChange);

  await loadQuestions();
}

async function onFilterChange() {
  localStorage.setItem("examLastCategory", document.getElementById("select-category").value);
  localStorage.setItem("examLastScope", document.getElementById("select-scope").value);
  await loadQuestions();
}

async function loadQuestions() {
  const category = document.getElementById("select-category").value;
  const scope = document.getElementById("select-scope").value;
  currentCategory = category;
  const params = new URLSearchParams({ category, scope });
  const data = await apiGet("/api/liff/quiz/questions?" + params.toString());
  currentQuestions = data.questions || [];
  revealedAnswers = {};
  renderQuestions(data.notice);
}

function renderQuestions(notice) {
  const list = document.getElementById("question-list");
  const emptyHint = document.getElementById("quiz-empty");
  if (notice) {
    list.innerHTML = "";
    emptyHint.style.display = "block";
    emptyHint.textContent = notice;
    return;
  }
  if (!currentQuestions.length) {
    list.innerHTML = "";
    emptyHint.style.display = "block";
    emptyHint.textContent = "這個分類目前還沒有題目";
    return;
  }
  emptyHint.style.display = "none";
  list.innerHTML = currentQuestions.map((q, idx) => `
    <div class="q-card" id="qcard-${q.id}">
      <div class="q-head">
        <div class="q-title">${idx + 1}. ${escapeHtml(q.question)}</div>
        <button class="bookmark-btn" id="bm-${q.id}" onclick="toggleBookmark('${q.id}')" title="標記錯題">${ICON_BOOKMARK}</button>
      </div>
      <div class="options">
        ${Object.entries(q.options || {}).map(([key, text]) => `
          <label class="opt-label" id="opt-${q.id}-${key}">
            <input type="radio" name="ans-${q.id}" value="${key}" />
            <span>(${key}) ${escapeHtml(text)}</span>
          </label>
        `).join("")}
      </div>
      <div class="reveal-answer" id="reveal-${q.id}"></div>
      <div class="q-tools">
        <label class="toggle-wrap">
          <span class="switch">
            <input type="checkbox" onchange="onToggleReveal('${q.id}', this.checked)" />
            <span class="slider"></span>
          </span>
          顯示答案
        </label>
        <button class="link-btn" onclick="openAiPanel('${q.id}', false)">詳解 &amp; AI 即刻問</button>
      </div>
    </div>
  `).join("");
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

async function onToggleReveal(qid, checked) {
  const box = document.getElementById(`reveal-${qid}`);
  if (!checked) { box.classList.remove("show"); return; }
  if (!revealedAnswers[qid]) {
    const detail = await apiGet(`/api/liff/quiz/questions/${qid}`);
    revealedAnswers[qid] = detail;
  }
  const d = revealedAnswers[qid];
  box.textContent = `正確答案：(${d.answer}) ${(d.options || {})[d.answer] || ""}`;
  box.classList.add("show");
}

async function toggleBookmark(qid) {
  const data = await apiPost("/api/liff/quiz/bookmark", { question_id: qid });
  const btn = document.getElementById(`bm-${qid}`);
  btn.classList.toggle("active", !!data.bookmarked);
}

async function submitExam() {
  const answers = {};
  currentQuestions.forEach(q => {
    const picked = document.querySelector(`input[name="ans-${q.id}"]:checked`);
    if (picked) answers[q.id] = picked.value;
  });
  if (!Object.keys(answers).length) {
    alert("請至少作答一題再交卷");
    return;
  }
  const result = await apiPost("/api/liff/quiz/submit", { category: currentCategory, answers });
  showResult(result);
}

function showResult(result) {
  document.getElementById("grade-num").textContent = result.score;
  const wrongBox = document.getElementById("wrong-results");
  const correctBox = document.getElementById("correct-results");
  const wrongs = (result.results || []).filter(r => !r.is_correct);
  const corrects = (result.results || []).filter(r => r.is_correct);

  wrongBox.innerHTML = wrongs.length ? wrongs.map(r => `
    <div class="result-item">
      <div class="rq-title">${escapeHtml(r.question)}</div>
      <div class="rq-meta">你的答案：${r.your_answer || "（未作答）"}　正確答案：${r.correct_answer}</div>
      <button class="link-btn" onclick="openAiPanel('${r.id}', true)">看詳解</button>
    </div>
  `).join("") : '<div class="empty-hint">這次全對，沒有錯題。</div>';

  correctBox.innerHTML = corrects.length ? corrects.map(r => `
    <div class="result-item">
      <div class="rq-title">${escapeHtml(r.question)}</div>
      <div class="rq-meta">答對：${r.correct_answer}</div>
      <button class="link-btn" onclick="openAiPanel('${r.id}', true)">看詳解</button>
    </div>
  `).join("") : '<div class="empty-hint">這次沒有答對的題目</div>';

  document.getElementById("result-overlay").classList.add("active");
}

function closeResult() {
  // 交卷當下已經在 submit 時存檔完成，這裡單純關閉視窗（對應線框圖「正常關閉」流程）
  closeLiff();
}

async function openAiPanel(qid, fromResultPage) {
  currentAiQuestionId = qid;
  document.getElementById("ai-panel").classList.add("active");
  document.getElementById("ai-content").innerHTML = '<span class="ai-loading">產生中...</span>';
  document.getElementById("ai-followup-input").value = "";
  const data = await apiPost("/api/liff/quiz/explain", { question_id: qid });
  document.getElementById("ai-content").textContent = data.reply || data.error || "AI 回覆失敗，請再試一次";
}

function closeAiPanel() {
  document.getElementById("ai-panel").classList.remove("active");
  currentAiQuestionId = null;
}

async function sendFollowUp() {
  const input = document.getElementById("ai-followup-input");
  const text = input.value.trim();
  if (!text || !currentAiQuestionId) return;
  document.getElementById("ai-content").innerHTML = '<span class="ai-loading">產生中...</span>';
  input.value = "";
  const data = await apiPost("/api/liff/quiz/explain", { question_id: currentAiQuestionId, follow_up: text });
  document.getElementById("ai-content").textContent = data.reply || data.error || "AI 回覆失敗，請再試一次";
}

async function loadWrongQuestions() {
  const category = document.getElementById("wrong-category-filter").value;
  const params = category ? "?category=" + encodeURIComponent(category) : "";
  const data = await apiGet("/api/liff/quiz/wrong-questions" + params);
  const items = data.questions || [];
  const list = document.getElementById("wrong-list");
  const emptyHint = document.getElementById("wrong-empty");
  if (!items.length) {
    list.innerHTML = "";
    emptyHint.style.display = "block";
    return;
  }
  emptyHint.style.display = "none";
  list.innerHTML = items.map(q => `
    <div class="wrong-item">
      <div>
        <div class="wq-text">${escapeHtml(q.question)}</div>
        <div class="wq-cat">${escapeHtml(q.category || "")} ・ 正確答案：${q.answer}</div>
      </div>
      <button class="remove-btn" onclick="removeWrong('${q.id}')" title="移除">${ICON_CHECK}</button>
    </div>
  `).join("");
}

document.getElementById("wrong-category-filter").addEventListener("change", loadWrongQuestions);

async function removeWrong(qid) {
  await apiDelete(`/api/liff/quiz/wrong-questions/${qid}`);
  loadWrongQuestions();
}

initApp();
</script>
</body>
</html>
