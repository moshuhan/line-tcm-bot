<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>中醫口說教練</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #2b241d;
    --ink-soft: #7a6d5c;
    --paper: #f6efe2;
    --surface: #fffcf6;
    --line: #e5d9c3;
    --terracotta: #b8562f;
    --terracotta-soft: #f1ddc9;
    --sage: #5f7052;
    --sage-soft: #e3e8d9;
    --gold: #a9843f;
    --danger: #a8451f;
    --danger-soft: #f3ded1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--paper); color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  h1, h2, h3 { font-family: "Noto Serif TC", "Noto Sans TC", serif; }
  .view { display: none; height: 100%; flex-direction: column; }
  .view.active { display: flex; }

  /* ---- 主畫面 ---- */
  #view-home { padding: 20px; }
  .home-top { display: flex; justify-content: space-between; align-items: center; }
  .home-top h1 { font-size: 18px; margin: 0; font-weight: 800; letter-spacing: .02em; }
  .close-x { border: none; background: none; font-size: 20px; cursor: pointer; color: var(--ink-soft); line-height: 1; padding: 4px; }
  .scenario-list { margin-top: 26px; display: flex; flex-direction: column; gap: 12px; }
  .scenario-card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 18px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 14px;
    box-shadow: 0 1px 2px rgba(43,36,29,.04);
    transition: transform .1s ease, border-color .15s ease;
  }
  .scenario-card:active { transform: scale(.98); border-color: var(--gold); }
  .scenario-card .avatar {
    width: 50px; height: 50px; border-radius: 50%; background: var(--terracotta-soft);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--terracotta);
  }
  .scenario-card .avatar svg { width: 24px; height: 24px; }
  .scenario-card .meta .title { font-size: 15px; font-weight: 700; }
  .scenario-card .meta .sub { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .home-hint { color: var(--ink-soft); font-size: 13px; text-align: center; margin-top: 32px; }

  /* ---- 對話畫面 ---- */
  #view-dialogue { }
  .dlg-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); flex-shrink: 0;
  }
  .top-btn { border: none; background: none; font-size: 14px; color: var(--ink-soft); cursor: pointer; font-weight: 500; padding: 6px 4px; }
  .hangup-btn {
    border: none; background: var(--danger); color: #fff9f2; border-radius: 999px;
    width: 34px; height: 34px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s ease;
  }
  .hangup-btn:active { transform: scale(.92); }
  .hangup-btn svg { width: 16px; height: 16px; }
  .dlg-upper { display: flex; gap: 10px; padding: 12px 14px; flex-shrink: 0; }
  .char-panel {
    flex: 0 0 96px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .char-avatar {
    width: 76px; height: 76px; border-radius: 50%; background: var(--terracotta-soft);
    display: flex; align-items: center; justify-content: center; color: var(--terracotta);
    border: 3px solid transparent;
    transition: border-color .2s ease;
  }
  .char-avatar svg { width: 34px; height: 34px; }
  .char-avatar.speaking { border-color: var(--terracotta); }
  .char-name { font-size: 12px; color: var(--ink-soft); text-align: center; }
  .hint-box {
    flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    font-size: 12px; color: var(--ink-soft); max-height: 130px; overflow-y: auto;
  }
  .hint-box.collapsed .hint-body { display: none; }
  .hint-box-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-weight: 700; color: var(--ink); }
  .hint-body ul { margin: 6px 0 0; padding-left: 16px; }
  .hint-body h4 { margin: 8px 0 2px; font-size: 12px; color: var(--ink); font-family: inherit; }

  #transcript-log { flex: 1; overflow-y: auto; padding: 6px 14px; }
  .bubble-row { display: flex; margin-bottom: 10px; }
  .bubble-row.from-char { justify-content: flex-start; }
  .bubble-row.from-user { justify-content: flex-end; }
  .bubble { max-width: 78%; padding: 10px 12px; border-radius: 14px; font-size: 14px; line-height: 1.5; }
  .from-char .bubble { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 4px; }
  .from-user .bubble { background: var(--terracotta); color: #fff9f2; border-top-right-radius: 4px; }
  .bubble-zh { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .bubble .err { color: var(--danger); font-weight: 700; text-decoration: underline wavy; }
  .from-user .bubble .err { color: #ffe1cf; text-decoration: underline wavy #ffe1cf; }

  .mic-bar { flex-shrink: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 8px; border-top: 1px solid var(--line); background: var(--surface); }
  .mic-btn {
    width: 60px; height: 60px; border-radius: 50%; border: none; cursor: pointer;
    background: #d9cbb0; color: #fff9f2;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, transform .1s ease;
  }
  .mic-btn svg { width: 24px; height: 24px; }
  .mic-btn:active { transform: scale(.94); }
  .mic-btn.live { background: var(--terracotta); }
  .mic-status { font-size: 12px; color: var(--ink-soft); }

  /* ---- 結算頁 ---- */
  #view-summary { padding: 0; }
  .sum-top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--surface); flex-shrink: 0;
  }
  .sum-body { flex: 1; overflow-y: auto; padding: 18px; }
  .sum-item { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 15px; margin-bottom: 12px; }
  .sum-label { font-size: 11px; color: var(--ink-soft); font-weight: 700; margin-bottom: 5px; letter-spacing: .04em; }
  .sum-original { font-size: 14px; color: var(--ink); line-height: 1.6; }
  .sum-original .err { color: var(--danger); background: var(--danger-soft); padding: 0 2px; border-radius: 4px; }
  .sum-corrected { font-size: 14px; color: var(--sage); margin-top: 10px; font-weight: 700; line-height: 1.6; }
  .empty-hint { color: var(--ink-soft); font-size: 14px; text-align: center; padding: 44px 10px; }
</style>
</head>
<body>

<!-- 主畫面 -->
<section id="view-home" class="view active">
  <div class="home-top">
    <h1>中醫口說教練</h1>
    <button class="close-x" onclick="closeLiff()">✕</button>
  </div>
  <div class="scenario-list" id="scenario-list"></div>
  <div class="home-hint">選一個主題開始練習，全程用英文對話</div>
</section>

<!-- 對話畫面 -->
<section id="view-dialogue" class="view">
  <div class="dlg-top">
    <button class="top-btn" onclick="backToHome(false)">← 回主頁</button>
    <button class="hangup-btn" onclick="hangUp()" title="結束對話"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>
  </div>
  <div class="dlg-upper">
    <div class="char-panel">
      <div class="char-avatar" id="char-avatar"></div>
      <div class="char-name" id="char-name">患者</div>
    </div>
    <div class="hint-box collapsed" id="hint-box">
      <div class="hint-box-head" onclick="toggleHint()">
        <span style="display:flex;align-items:center;gap:6px;"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg> 話題提示</span>
        <span id="hint-toggle-icon">▸</span>
      </div>
      <div class="hint-body">
        <h4>可以聊的方向</h4>
        <ul id="hint-topics"></ul>
        <h4>中醫英文詞彙</h4>
        <ul id="hint-vocab"></ul>
      </div>
    </div>
  </div>
  <div id="transcript-log"></div>
  <div class="mic-bar">
    <button class="mic-btn" id="mic-btn" onclick="toggleMic()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v4"/><path d="M8 23h8"/></svg></button>
    <div class="mic-status" id="mic-status">連線中...</div>
  </div>
</section>

<!-- 結算頁 -->
<section id="view-summary" class="view">
  <div class="sum-top">
    <button class="top-btn" onclick="backToHome(true)">← Home</button>
    <button class="top-btn" onclick="restartConversation()">→ Restart conversation</button>
  </div>
  <div class="sum-body" id="summary-body"></div>
</section>

<audio id="remote-audio" autoplay></audio>

<script>
const LIFF_ID = "2011558628-VDHP3SsC";
// 本機 ngrok 預覽用：網址加 ?debug=1 就跳過真的 LINE 登入，token 要跟後端
// LIFF_DEBUG_TOKEN 環境變數一致，正式站不會設這個變數。
const DEBUG_MODE = new URLSearchParams(location.search).get("debug") === "1";
const DEBUG_TOKEN = "a2i4s9Op3RsVegplYqnjr28RD4m2Ymrb";

const ICON_PATIENT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>';
const ICON_PROFESSOR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10L12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.5 2.5 3 6 3s6-1.5 6-3v-5"/></svg>';

let idToken = null;
let scenarios = {};
let currentScenarioKey = null;
let pc = null;
let dc = null;
let localStream = null;
let micLive = false;
let transcript = [];       // [{role: 'user'|'assistant', text}]，只存在這次瀏覽器 session
let charDeltaBuffer = "";
let charBubbleEl = null;

function authHeaders() {
  return idToken ? { "Authorization": "Bearer " + idToken, "Content-Type": "application/json" } : { "Content-Type": "application/json" };
}
async function apiGet(path) {
  const res = await fetch(path, { headers: authHeaders() });
  return res.json();
}
async function apiPost(path, body) {
  const res = await fetch(path, { method: "POST", headers: authHeaders(), body: JSON.stringify(body || {}) });
  return res.json();
}
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
function renderAnnotated(annotated) {
  return escapeHtml(annotated).replace(/«(.+?)»/g, '<span class="err">$1</span>');
}

function closeLiff() {
  try { liff.closeWindow(); } catch (e) { window.close(); }
}

function switchView(name) {
  ["home", "dialogue", "summary"].forEach(v => {
    document.getElementById("view-" + v).classList.toggle("active", v === name);
  });
}

async function initApp() {
  if (!DEBUG_MODE) {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      idToken = liff.getIDToken();
    } catch (e) {
      document.getElementById("scenario-list").innerHTML =
        '<div class="empty-hint">LIFF 初始化失敗，請確認是從 LINE 內開啟這個頁面。</div>';
      return;
    }
  } else {
    idToken = DEBUG_TOKEN;
  }
  const data = await apiGet("/api/liff/speaking/scenarios");
  (data.scenarios || []).forEach(s => { scenarios[s.key] = s; });
  renderHome();
}

function renderHome() {
  const icons = { clinical: ICON_PATIENT, academic: ICON_PROFESSOR };
  const list = document.getElementById("scenario-list");
  list.innerHTML = Object.values(scenarios).map(s => `
    <button class="scenario-card" onclick="startConversation('${s.key}')">
      <div class="avatar">${icons[s.key] || ICON_PATIENT}</div>
      <div class="meta">
        <div class="title">${escapeHtml(s.label_zh)}</div>
        <div class="sub">對話角色：${escapeHtml(s.character_zh)}</div>
      </div>
    </button>
  `).join("");
}

function toggleHint() {
  const box = document.getElementById("hint-box");
  box.classList.toggle("collapsed");
  document.getElementById("hint-toggle-icon").textContent = box.classList.contains("collapsed") ? "▸" : "▾";
}

async function startConversation(scenarioKey) {
  currentScenarioKey = scenarioKey;
  transcript = [];
  charDeltaBuffer = "";
  charBubbleEl = null;

  const s = scenarios[scenarioKey] || {};
  document.getElementById("char-name").textContent = s.character_zh || "";
  document.getElementById("char-avatar").innerHTML = scenarioKey === "academic" ? ICON_PROFESSOR : ICON_PATIENT;
  document.getElementById("hint-topics").innerHTML = (s.hints?.topics || []).map(t => `<li>${escapeHtml(t)}</li>`).join("");
  document.getElementById("hint-vocab").innerHTML = (s.hints?.vocab || []).map(t => `<li>${escapeHtml(t)}</li>`).join("");
  document.getElementById("transcript-log").innerHTML = "";
  document.getElementById("mic-status").textContent = "連線中...";
  document.getElementById("mic-btn").classList.remove("live");
  micLive = false;

  switchView("dialogue");

  const sessionRes = await apiPost("/api/liff/speaking/session", { scenario: scenarioKey });
  if (sessionRes.error || !sessionRes.client_secret) {
    document.getElementById("mic-status").textContent = "連線失敗：" + (sessionRes.error || "未知錯誤");
    return;
  }

  try {
    await connectRealtime(sessionRes.client_secret, sessionRes.model);
    document.getElementById("mic-status").textContent = "已連線，按下麥克風開始說話";
  } catch (e) {
    console.error("[speaking] connectRealtime failed", e);
    document.getElementById("mic-status").textContent = "連線失敗，請重新嘗試";
  }
}

async function connectRealtime(ephemeralKey, model) {
  pc = new RTCPeerConnection();
  pc.ontrack = (e) => { document.getElementById("remote-audio").srcObject = e.streams[0]; };

  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  localStream.getTracks().forEach(track => {
    track.enabled = false; // 一開始靜音，按下麥克風才開始傳送
    pc.addTrack(track, localStream);
  });

  dc = pc.createDataChannel("oai-events");
  dc.addEventListener("message", handleRealtimeEvent);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const resp = await fetch(`https://api.openai.com/v1/realtime/calls?model=${encodeURIComponent(model)}`, {
    method: "POST",
    body: offer.sdp,
    headers: {
      "Authorization": `Bearer ${ephemeralKey}`,
      "Content-Type": "application/sdp",
    },
  });
  if (!resp.ok) throw new Error("SDP exchange failed: " + resp.status);
  const answerSdp = await resp.text();
  await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
}

function toggleMic() {
  if (!localStream) return;
  micLive = !micLive;
  localStream.getTracks().forEach(track => { track.enabled = micLive; });
  document.getElementById("mic-btn").classList.toggle("live", micLive);
  document.getElementById("mic-status").textContent = micLive ? "聆聽中，直接開口說話" : "已暫停，按下麥克風繼續";
}

function handleRealtimeEvent(e) {
  let evt;
  try { evt = JSON.parse(e.data); } catch (err) { return; }
  // 開發用：實際事件名稱以 Realtime API 目前版本為準，先全部印出來方便對照調整
  console.log("[realtime event]", evt.type, evt);

  if (evt.type === "conversation.item.input_audio_transcription.completed") {
    handleUserTranscript(evt.transcript || "");
    return;
  }
  if (typeof evt.type === "string" && evt.type.includes("audio_transcript")) {
    if (evt.type.endsWith(".delta")) {
      appendCharDelta(evt.delta || "");
    } else if (evt.type.endsWith(".done")) {
      finalizeCharLine(evt.transcript || charDeltaBuffer);
    }
    return;
  }
  if (evt.type === "response.created" || evt.type === "response.output_item.added") {
    document.getElementById("char-avatar").classList.add("speaking");
  }
  if (evt.type === "response.done") {
    document.getElementById("char-avatar").classList.remove("speaking");
  }
  if (evt.type === "error") {
    console.error("[realtime error]", evt);
  }
}

function addBubble(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "bubble-row " + (role === "user" ? "from-user" : "from-char");
  wrap.innerHTML = `
    <div class="bubble">
      <div class="bubble-en">${escapeHtml(text)}</div>
      ${role === "assistant" ? '<div class="bubble-zh"></div>' : ""}
    </div>`;
  const log = document.getElementById("transcript-log");
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap;
}

function appendCharDelta(delta) {
  if (!charBubbleEl) charBubbleEl = addBubble("assistant", "");
  charDeltaBuffer += delta;
  charBubbleEl.querySelector(".bubble-en").textContent = charDeltaBuffer;
}

async function finalizeCharLine(fullText) {
  const text = (fullText || charDeltaBuffer || "").trim();
  charDeltaBuffer = "";
  if (!text) { charBubbleEl = null; return; }
  transcript.push({ role: "assistant", text });
  if (!charBubbleEl) charBubbleEl = addBubble("assistant", text);
  const bubbleForTranslate = charBubbleEl;
  charBubbleEl = null;
  try {
    const zh = await apiPost("/api/liff/speaking/translate", { text });
    bubbleForTranslate.querySelector(".bubble-zh").textContent = zh.translated || "";
  } catch (e) { /* 翻譯失敗不影響對話進行 */ }
}

async function handleUserTranscript(text) {
  text = (text || "").trim();
  if (!text) return;
  transcript.push({ role: "user", text });
  const bubble = addBubble("user", text);
  try {
    const res = await apiPost("/api/liff/speaking/analyze-turn", { text });
    bubble.querySelector(".bubble-en").innerHTML = renderAnnotated(res.annotated || text);
  } catch (e) { /* 標註失敗就維持原始文字 */ }
}

function teardownConnection() {
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (dc) { try { dc.close(); } catch (e) {} dc = null; }
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  micLive = false;
}

async function hangUp() {
  teardownConnection();
  const data = await apiPost("/api/liff/speaking/summary", { transcript });
  renderSummary(data.items || []);
  switchView("summary");
}

function backToHome(fromSummary) {
  // 對應線框圖「中途異常關閉不存紀錄」：直接切斷連線、不呼叫 summary，逐字稿隨頁面狀態捨棄
  if (!fromSummary) teardownConnection();
  transcript = [];
  switchView("home");
}

function restartConversation() {
  if (currentScenarioKey) startConversation(currentScenarioKey);
}

function renderSummary(items) {
  const body = document.getElementById("summary-body");
  if (!items.length) {
    body.innerHTML = '<div class="empty-hint">這次對話沒有偵測到明顯錯誤，表現得很好。</div>';
    return;
  }
  body.innerHTML = items.map(it => `
    <div class="sum-item">
      <div class="sum-label">原句</div>
      <div class="sum-original">${renderAnnotated(it.original)}</div>
      <div class="sum-label" style="margin-top:8px;">修正後</div>
      <div class="sum-corrected">${escapeHtml(it.corrected)}</div>
    </div>
  `).join("");
}

initApp();
</script>
</body>
</html>
