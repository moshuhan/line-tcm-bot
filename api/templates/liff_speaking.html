<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>中醫口說教練</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @layer base { html, body { width: 100vw; margin: 0; padding: 0; } body { overscroll-behavior: none; } }
  ::-webkit-scrollbar { display: none; }
  body { font-family: 'Plus Jakarta Sans', 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
  .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
  .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
  .page { display: none; }
  .page.active { display: flex; }
  .err { color: #ea580c; font-weight: 700; text-decoration: underline wavy #ea580c; }
  .char-avatar.speaking { box-shadow: 0 0 0 3px #05966955; }
  .mic-btn.live { background: #059669 !important; }
  .mic-btn.live .pulse { display: block; }
</style>
</head>
<body class="flex flex-col min-h-screen">

<!-- ============ PAGE: HOME ============ -->
<div class="page flex-col w-full min-h-screen" id="page-home">
  <header class="fixed top-0 w-full z-50 pt-safe bg-white/90 backdrop-blur-xl border-b border-slate-200">
    <div class="h-14 px-4 max-w-[480px] mx-auto flex items-center justify-between">
      <span class="text-[15px] font-bold text-slate-800">LinguaPulse TCM 中醫英文教練</span>
      <button onclick="closeLiff()" class="w-8 h-8 flex items-center justify-center text-slate-400"><span class="material-symbols-outlined text-[20px]">close</span></button>
    </div>
  </header>
  <main class="flex flex-col w-full max-w-[480px] mx-auto px-4 pt-16 pb-10 gap-4">
    <div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3 flex items-center gap-2">
      <span class="material-symbols-outlined text-emerald-600 text-[18px]">cloud_sync</span>
      <span class="text-[12px] text-emerald-800 font-medium">雲端同步已啟動．自動儲存學習進度</span>
    </div>
    <h1 class="text-xl font-bold text-slate-800" id="home-greeting">歡迎回來</h1>
    <p class="text-[13px] text-slate-500 -mt-2">選擇今日演練主題，以沉浸式情境強化英文病史衛教或期前討論思維。</p>
    <div id="scenario-list" class="flex flex-col gap-4"></div>
  </main>
</div>

<!-- ============ PAGE: DIALOGUE ============ -->
<div class="page flex-col w-full h-screen" id="page-dialogue">
  <header class="pt-safe bg-white/95 backdrop-blur-xl border-b border-slate-200 shrink-0">
    <div class="h-12 px-3 max-w-[480px] mx-auto flex items-center justify-between">
      <button onclick="backToHome(false)" class="flex items-center gap-1 text-emerald-700 text-[13px] font-semibold"><span class="material-symbols-outlined text-[18px]">home</span>回主頁</button>
      <span class="flex items-center gap-1 px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 text-[12px] font-bold"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>OSCE <span id="dlg-timer">00:00</span></span>
      <button onclick="hangUp()" class="flex items-center gap-1 px-2 py-1 rounded-full bg-rose-50 text-rose-600 text-[12px] font-bold"><span class="material-symbols-outlined text-[15px]">call_end</span>結束對話</button>
    </div>
  </header>
  <div class="max-w-[480px] mx-auto w-full px-3 pt-2 shrink-0">
    <div class="bg-white border border-slate-200 rounded-xl p-2.5 flex items-center gap-2.5 shadow-sm">
      <div class="w-11 h-11 rounded-full bg-emerald-100 flex items-center justify-center shrink-0 char-avatar" id="char-avatar">
        <span class="material-symbols-outlined text-emerald-700 text-[22px]" id="char-avatar-icon">person</span>
      </div>
      <div class="min-w-0 flex-1">
        <div class="flex items-center gap-1.5">
          <span class="text-[14px] font-bold text-slate-800" id="char-name">患者</span>
          <span class="text-[11px] text-slate-400" id="char-meta"></span>
        </div>
        <p class="text-[12px] text-slate-500 truncate" id="char-complaint"></p>
      </div>
    </div>
    <div class="mt-2 bg-slate-50 border border-slate-200 rounded-xl" id="hint-box">
      <button class="w-full flex items-center justify-between px-3 py-2" onclick="toggleHint()">
        <span class="flex items-center gap-1.5 text-[12px] font-bold text-slate-600"><span class="material-symbols-outlined text-[15px] text-emerald-600">lightbulb</span>衛教與術語引導提示 (Topic Hints)</span>
        <span class="material-symbols-outlined text-[16px] text-slate-400" id="hint-toggle-icon">expand_more</span>
      </button>
      <div class="hidden px-3 pb-2.5" id="hint-body">
        <div class="flex flex-wrap gap-1.5" id="hint-topics"></div>
      </div>
    </div>
  </div>
  <div id="transcript-log" class="flex-1 overflow-y-auto px-3 py-3 flex flex-col gap-3 max-w-[480px] mx-auto w-full"></div>
  <div class="shrink-0 border-t border-slate-200 bg-white pb-safe">
    <div class="max-w-[480px] mx-auto flex flex-col items-center gap-1.5 py-3">
      <button id="mic-btn" onclick="toggleMic()" class="relative w-16 h-16 rounded-full bg-slate-300 text-white flex items-center justify-center transition-colors active:scale-95">
        <span class="pulse absolute inset-0 rounded-full bg-emerald-400 animate-ping" style="display:none;"></span>
        <span class="material-symbols-outlined text-[26px] relative">mic</span>
      </button>
      <span class="text-[12px] text-slate-500" id="mic-status">連線中...</span>
    </div>
  </div>
</div>

<!-- ============ PAGE: SUMMARY ============ -->
<div class="page flex-col w-full min-h-screen" id="page-summary">
  <header class="fixed top-0 w-full z-50 pt-safe bg-white/90 backdrop-blur-xl border-b border-slate-200">
    <div class="h-14 px-4 max-w-[480px] mx-auto flex items-center justify-between">
      <button onclick="backToHome(true)" class="flex items-center gap-1 text-slate-500 text-[13px] font-semibold"><span class="material-symbols-outlined text-[18px]">arrow_back</span>Home</button>
      <span class="text-[15px] font-bold text-slate-800">Diagnostic Feedback</span>
      <button onclick="restartConversation()" class="text-emerald-700 text-[12px] font-bold flex items-center gap-1">重新對話<span class="material-symbols-outlined text-[16px]">restart_alt</span></button>
    </div>
  </header>
  <main class="flex flex-col w-full max-w-[480px] mx-auto px-4 pt-16 pb-10 gap-4" id="summary-body"></main>
</div>

<audio id="remote-audio" autoplay></audio>

<script>
const LIFF_ID = "2011558628-VDHP3SsC";
const DEBUG_MODE = new URLSearchParams(location.search).get("debug") === "1";
const DEBUG_TOKEN = "a2i4s9Op3RsVegplYqnjr28RD4m2Ymrb";

const ICON_PATIENT = "personal_injury";
const ICON_PROFESSOR = "school";

let idToken = null;
let scenarios = {};
let currentScenarioKey = null;
let currentSessionId = null;
let pc = null;
let dc = null;
let localStream = null;
let micLive = false;
let transcript = [];
let charDeltaBuffer = "";
let charBubbleEl = null;
let pendingAssistantText = "";
let pendingAssistantBubble = null;
let dialogueStartedAt = null;
let dialogueTimerHandle = null;

function authHeaders() {
  return idToken ? { "Authorization": "Bearer " + idToken, "Content-Type": "application/json" } : { "Content-Type": "application/json" };
}
async function apiGet(path) {
  const res = await fetch(path, { headers: authHeaders() });
  return res.json();
}
async function apiPost(path, body) {
  const res = await fetch(path, { method: "POST", headers: authHeaders(), body: JSON.stringify(body || {}) });
  return res.json();
}
function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}
function renderAnnotated(annotated) {
  return escapeHtml(annotated).replace(/«(.+?)»/g, '<span class="err">$1</span>');
}
function closeLiff() { try { liff.closeWindow(); } catch (e) { window.close(); } }

function showPage(name) {
  document.querySelectorAll(".page").forEach(el => el.classList.remove("active"));
  document.getElementById("page-" + name).classList.add("active");
}

async function initApp() {
  if (!DEBUG_MODE) {
    try {
      await liff.init({ liffId: LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login(); return; }
      idToken = liff.getIDToken();
    } catch (e) {
      document.getElementById("scenario-list").innerHTML = '<div class="text-center text-slate-400 text-sm py-16">LIFF 初始化失敗，請從 LINE 內開啟這個頁面。</div>';
      return;
    }
  } else {
    idToken = DEBUG_TOKEN;
  }
  const hour = new Date().getHours();
  document.getElementById("home-greeting").textContent = (hour < 11 ? "早安" : hour < 18 ? "午安" : "晚安") + "，歡迎回來";
  const data = await apiGet("/api/liff/speaking/scenarios");
  (data.scenarios || []).forEach(s => { scenarios[s.key] = s; });
  renderHome();
  showPage("home");
}

function renderHome() {
  const icons = { clinical: ICON_PATIENT, academic: ICON_PROFESSOR };
  const list = document.getElementById("scenario-list");
  list.innerHTML = Object.values(scenarios).map(s => {
    const p = s.preview || {};
    const quote = s.key === "clinical" ? p.chief_complaint : p.title;
    const meta = s.key === "clinical" ? `${p.age ?? "—"}y · ${escapeHtml(p.gender || "")}` : "學術討論";
    const topics = (p.expected_topics || []).slice(0, 4);
    return `
      <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-sm flex flex-col gap-2.5">
        <div class="flex items-center gap-2.5">
          <div class="w-11 h-11 rounded-full bg-emerald-100 flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-emerald-700 text-[22px]">${icons[s.key] || ICON_PATIENT}</span>
          </div>
          <div class="min-w-0">
            <div class="text-[15px] font-bold text-slate-800">${escapeHtml(s.label_zh)}</div>
            <div class="text-[12px] text-slate-500">對話角色：${escapeHtml(s.character_zh)} · ${meta}</div>
          </div>
        </div>
        ${quote ? `<div class="bg-slate-50 rounded-lg p-2.5 text-[13px] text-slate-700 italic">"${escapeHtml(quote)}"</div>` : ""}
        <div class="flex flex-wrap gap-1.5">
          ${topics.map(t => `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[11px]">${escapeHtml(t.length > 24 ? t.slice(0, 24) + "…" : t)}</span>`).join("")}
        </div>
        <button type="button" onclick="startConversation('${s.key}')" class="w-full py-3 rounded-xl bg-emerald-600 text-white font-bold text-[14px] flex items-center justify-center gap-1.5 active:scale-[0.98] transition">
          <span class="material-symbols-outlined text-[18px]">mic</span><span>啟動對話 (Start Consultation)</span>
        </button>
      </div>
    `;
  }).join("");
}

function toggleHint() {
  const body = document.getElementById("hint-body");
  const icon = document.getElementById("hint-toggle-icon");
  const collapsed = body.classList.contains("hidden");
  body.classList.toggle("hidden");
  icon.textContent = collapsed ? "expand_less" : "expand_more";
}

async function startConversation(scenarioKey) {
  currentScenarioKey = scenarioKey;
  transcript = [];
  charDeltaBuffer = "";
  charBubbleEl = null;
  pendingAssistantText = "";
  pendingAssistantBubble = null;

  const s = scenarios[scenarioKey] || {};
  const p = s.preview || {};
  document.getElementById("char-name").textContent = s.character_zh || "";
  document.getElementById("char-avatar-icon").textContent = scenarioKey === "academic" ? ICON_PROFESSOR : ICON_PATIENT;
  document.getElementById("char-meta").textContent = scenarioKey === "clinical" ? `${p.age ?? "—"}y · ${p.gender || ""}` : "";
  document.getElementById("char-complaint").textContent = scenarioKey === "clinical" ? (p.chief_complaint || "") : (p.title || "");
  document.getElementById("hint-topics").innerHTML = (p.expected_topics || []).map(t => `<span class="px-2 py-1 rounded-full bg-white border border-slate-200 text-slate-600 text-[11px]">${escapeHtml(t)}</span>`).join("");
  document.getElementById("transcript-log").innerHTML = "";
  document.getElementById("mic-status").textContent = "連線中...";
  document.getElementById("mic-btn").classList.remove("live");
  document.getElementById("mic-btn").className = "relative w-16 h-16 rounded-full bg-slate-300 text-white flex items-center justify-center transition-colors active:scale-95";
  micLive = false;
  dialogueStartedAt = Date.now();
  startDialogueTimer();

  showPage("dialogue");

  const sessionRes = await apiPost("/api/liff/speaking/session", { mode: scenarioKey });
  if (sessionRes.error || !sessionRes.client_secret) {
    document.getElementById("mic-status").textContent = "連線失敗：" + (sessionRes.error || "未知錯誤");
    return;
  }
  currentSessionId = sessionRes.session_id;

  try {
    await connectRealtime(sessionRes.client_secret, sessionRes.model);
    document.getElementById("mic-status").textContent = "已連線，按下麥克風開始說話";
  } catch (e) {
    console.error("[speaking] connectRealtime failed", e);
    document.getElementById("mic-status").textContent = "連線失敗，請重新嘗試";
  }
}

function startDialogueTimer() {
  stopDialogueTimer();
  dialogueTimerHandle = setInterval(() => {
    const secs = Math.floor((Date.now() - dialogueStartedAt) / 1000);
    const mm = String(Math.floor(secs / 60)).padStart(2, "0");
    const ss = String(secs % 60).padStart(2, "0");
    document.getElementById("dlg-timer").textContent = `${mm}:${ss}`;
  }, 1000);
}
function stopDialogueTimer() {
  if (dialogueTimerHandle) { clearInterval(dialogueTimerHandle); dialogueTimerHandle = null; }
}

async function connectRealtime(ephemeralKey, model) {
  pc = new RTCPeerConnection();
  pc.ontrack = (e) => { document.getElementById("remote-audio").srcObject = e.streams[0]; };

  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  localStream.getTracks().forEach(track => {
    track.enabled = false;
    pc.addTrack(track, localStream);
  });

  dc = pc.createDataChannel("oai-events");
  dc.addEventListener("message", handleRealtimeEvent);

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);

  const resp = await fetch(`https://api.openai.com/v1/realtime/calls?model=${encodeURIComponent(model)}`, {
    method: "POST",
    body: offer.sdp,
    headers: { "Authorization": `Bearer ${ephemeralKey}`, "Content-Type": "application/sdp" },
  });
  if (!resp.ok) throw new Error("SDP exchange failed: " + resp.status);
  const answerSdp = await resp.text();
  await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
}

function toggleMic() {
  if (!localStream) return;
  micLive = !micLive;
  localStream.getTracks().forEach(track => { track.enabled = micLive; });
  const btn = document.getElementById("mic-btn");
  btn.className = "relative w-16 h-16 rounded-full text-white flex items-center justify-center transition-colors active:scale-95 " + (micLive ? "bg-emerald-600 live" : "bg-slate-300");
  btn.querySelector(".pulse").style.display = micLive ? "block" : "none";
  document.getElementById("mic-status").textContent = micLive ? "聆聽中，直接開口說話" : "已暫停，按下麥克風繼續";
}

function handleRealtimeEvent(e) {
  let evt;
  try { evt = JSON.parse(e.data); } catch (err) { return; }
  if (evt.type === "conversation.item.input_audio_transcription.completed") {
    handleUserTranscript(evt.transcript || "");
    return;
  }
  if (typeof evt.type === "string" && evt.type.includes("audio_transcript")) {
    if (evt.type.endsWith(".delta")) {
      appendCharDelta(evt.delta || "");
    } else if (evt.type.endsWith(".done")) {
      finalizeCharLine(evt.transcript || charDeltaBuffer);
    }
    return;
  }
  if (evt.type === "response.created" || evt.type === "response.output_item.added") {
    document.getElementById("char-avatar").classList.add("speaking");
  }
  if (evt.type === "response.done") {
    document.getElementById("char-avatar").classList.remove("speaking");
  }
  if (evt.type === "error") { console.error("[realtime error]", evt); }
}

function addBubble(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "flex " + (role === "user" ? "justify-end" : "justify-start");
  wrap.innerHTML = `
    <div class="max-w-[80%] flex flex-col ${role === "user" ? "items-end" : "items-start"}">
      <div class="rounded-2xl px-3.5 py-2.5 text-[14px] leading-relaxed ${role === "user" ? "bg-emerald-600 text-white rounded-br-sm" : "bg-white border border-slate-200 text-slate-800 rounded-bl-sm"}">
        <span class="bubble-en">${escapeHtml(text)}</span>
      </div>
      <div class="text-[12px] text-slate-400 mt-1 px-1 bubble-zh"></div>
      <div class="flex flex-col gap-1 mt-1 bubble-chips w-full items-${role === "user" ? "end" : "start"}"></div>
    </div>`;
  const log = document.getElementById("transcript-log");
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
  return wrap;
}

function appendCharDelta(delta) {
  if (!charBubbleEl) charBubbleEl = addBubble("assistant", "");
  charDeltaBuffer += delta;
  charBubbleEl.querySelector(".bubble-en").textContent = charDeltaBuffer;
}

function finalizeCharLine(fullText) {
  const text = (fullText || charDeltaBuffer || "").trim();
  charDeltaBuffer = "";
  if (!text) { charBubbleEl = null; return; }
  transcript.push({ role: "assistant", text });
  if (!charBubbleEl) charBubbleEl = addBubble("assistant", text);
  pendingAssistantText = text;
  pendingAssistantBubble = charBubbleEl;
  pendingAssistantBubble.querySelector(".bubble-zh").textContent = "翻譯中…";
  charBubbleEl = null;
}

async function handleUserTranscript(text) {
  text = (text || "").trim();
  if (!text) return;
  transcript.push({ role: "user", text });
  const bubble = addBubble("user", text);
  if (!currentSessionId) return;
  const assistantText = pendingAssistantText;
  const assistantBubble = pendingAssistantBubble;
  pendingAssistantText = "";
  pendingAssistantBubble = null;
  try {
    const res = await apiPost("/api/liff/speaking/turn", { session_id: currentSessionId, assistant_text: assistantText, user_text: text });
    if (assistantBubble && res.translation) {
      assistantBubble.querySelector(".bubble-zh").textContent = res.translation;
    } else if (assistantBubble) {
      assistantBubble.querySelector(".bubble-zh").textContent = "";
    }
    const lf = res.language_feedback || {};
    if (lf.has_error && lf.annotated_original) {
      bubble.querySelector(".bubble-en").innerHTML = renderAnnotated(lf.annotated_original);
      const chips = bubble.querySelector(".bubble-chips");
      let chipHtml = "";
      if (lf.corrected_sentence) chipHtml += `<span class="px-2 py-1 rounded-lg bg-orange-50 border border-orange-200 text-orange-700 text-[11px]">Syntax: "${escapeHtml(lf.corrected_sentence)}"</span>`;
      if (lf.natural_sentence) chipHtml += `<span class="px-2 py-1 rounded-lg bg-indigo-50 border border-indigo-200 text-indigo-700 text-[11px]">Natural: "${escapeHtml(lf.natural_sentence)}"</span>`;
      chips.innerHTML = chipHtml;
    }
    if ((res.terminology || []).length) {
      const chips = bubble.querySelector(".bubble-chips");
      chips.innerHTML += res.terminology.map(t => `<span class="px-2 py-1 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px]">${escapeHtml(t)}</span>`).join("");
    }
    if (res.hint && res.hint.suggestion) {
      document.getElementById("hint-topics").innerHTML =
        `<span class="w-full px-2 py-1.5 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-800 text-[12px] font-medium">${escapeHtml(res.hint.suggestion)}</span>` +
        (res.hint.vocabulary || []).map(v => `<span class="px-2 py-1 rounded-full bg-white border border-slate-200 text-slate-600 text-[11px]">${escapeHtml(v)}</span>`).join("");
    }
  } catch (e) { /* 分析失敗不影響對話進行 */ }
}

function teardownConnection() {
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (dc) { try { dc.close(); } catch (e) {} dc = null; }
  if (pc) { try { pc.close(); } catch (e) {} pc = null; }
  micLive = false;
  stopDialogueTimer();
}

async function hangUp() {
  teardownConnection();
  document.getElementById("summary-body").innerHTML = '<div class="text-center text-slate-400 text-sm py-16">分析中...</div>';
  showPage("summary");
  const data = await apiPost("/api/liff/speaking/summary", { session_id: currentSessionId, transcript });
  renderSummary(data);
}

function backToHome(fromSummary) {
  if (!fromSummary) teardownConnection();
  transcript = [];
  currentSessionId = null;
  showPage("home");
}

function restartConversation() {
  if (currentScenarioKey) startConversation(currentScenarioKey);
}

function renderSummary(data) {
  const cp = data.clinical_precision || { score: 0, label: "" };
  const la = data.lexicon_accuracy || { score: 0, label: "" };
  const cases = data.cases || [];
  const utteranceCount = transcript.filter(t => t.role === "user").length;
  const durationSecs = dialogueStartedAt ? Math.floor((Date.now() - dialogueStartedAt) / 1000) : 0;
  const mm = String(Math.floor(durationSecs / 60)).padStart(2, "0");
  const ss = String(durationSecs % 60).padStart(2, "0");

  const body = document.getElementById("summary-body");
  let html = `
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-white border border-slate-200 rounded-xl p-3">
        <span class="text-[11px] text-slate-400">DURATION 結束時長</span>
        <div class="text-lg font-bold text-slate-800 mt-0.5">${mm}:${ss} <span class="text-[12px] font-normal text-slate-400">min</span></div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-3">
        <span class="text-[11px] text-slate-400">UTTERANCES 語句</span>
        <div class="text-lg font-bold text-slate-800 mt-0.5">${utteranceCount} <span class="text-[12px] font-normal ${cases.length ? "text-orange-500" : "text-slate-400"}">${cases.length} Flagged 待修</span></div>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-3">
        <span class="text-[11px] text-slate-400">CLINICAL PRECISION 臨床精準度</span>
        <div class="text-2xl font-bold text-emerald-600 mt-0.5">${cp.score}%</div>
        <span class="text-[11px] text-slate-500">${escapeHtml(cp.label || "")}</span>
      </div>
      <div class="bg-white border border-slate-200 rounded-xl p-3">
        <span class="text-[11px] text-slate-400">TCM LEXICON 標準度</span>
        <div class="text-2xl font-bold text-emerald-600 mt-0.5">${la.score}%</div>
        <span class="text-[11px] text-slate-500">${escapeHtml(la.label || "")}</span>
      </div>
    </div>
  `;

  if (cases.length) {
    html += `<div class="flex items-center gap-1.5 mt-1"><span class="w-1 h-4 rounded-full bg-orange-500"></span><span class="text-[14px] font-bold text-slate-800">診斷語句與病機修復分析</span><span class="text-[11px] text-slate-400">${cases.length} 項待精進</span></div>`;
    html += cases.map((c, i) => `
      <div class="bg-white border border-slate-200 rounded-xl p-3.5 flex flex-col gap-2">
        <div class="flex items-center justify-between">
          <span class="text-[11px] font-bold text-slate-500">Case #${String(i + 1).padStart(2, "0")} ${escapeHtml(c.category || "")}</span>
        </div>
        <div class="bg-orange-50 border border-orange-100 rounded-lg p-2.5">
          <div class="text-[10px] font-bold text-orange-600 mb-1">原始口說錄音 (User Original)</div>
          <div class="text-[13px] text-slate-700">"${renderAnnotated(c.original)}"</div>
        </div>
        <div class="bg-emerald-50 border border-emerald-100 rounded-lg p-2.5">
          <div class="text-[10px] font-bold text-emerald-700 mb-1">臨床規範表述 (Refinement)</div>
          <div class="text-[13px] text-slate-700 font-medium">"${escapeHtml(c.corrected)}"</div>
        </div>
        ${c.explanation ? `<div class="flex items-start gap-1.5 text-[12px] text-slate-500"><span class="material-symbols-outlined text-[15px] text-slate-400 mt-0.5">school</span><span>臨床口語診斷點評：${escapeHtml(c.explanation)}</span></div>` : ""}
      </div>
    `).join("");
  } else {
    html += `<div class="bg-white border border-slate-200 rounded-xl p-6 text-center text-slate-500 text-sm">這次對話沒有偵測到明顯錯誤，表現得很好。</div>`;
  }

  body.innerHTML = html;
}

initApp();
</script>
</body>
</html>
